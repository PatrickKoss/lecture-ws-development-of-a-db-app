<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm des Fahrradverleihs</title>
  <desc id="desc">Sechs eigenständige Entitätstypen, die Beziehungsentität Rental und ihre Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 29px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 21px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 24px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="zero-many-orange" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#ffa500" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="55" y="57" class="head" font-size="42">Fahrradverleih: Referenzmodell</text>
  <text x="1865" y="57" text-anchor="end" class="caption">orange gestrichelt = optionale Beziehung</text>

  <g aria-label="Station">
    <rect x="40" y="105" width="400" height="300" rx="16" class="box" />
    <text x="70" y="150" class="head">STATION</text>
    <line x1="40" y1="168" x2="440" y2="168" class="rel" />
    <text x="70" y="205" class="attr key">PK id</text>
    <text x="70" y="239" class="attr">UQ station_code</text>
    <text x="70" y="273" class="attr">UQ name</text>
    <text x="70" y="307" class="attr">UQ address</text>
    <text x="70" y="341" class="attr">capacity</text>
    <text x="70" y="375" class="attr">status</text>
  </g>

  <g aria-label="Ausleihe">
    <rect x="530" y="85" width="590" height="380" rx="16" class="box-main" />
    <text x="560" y="133" class="head">RENTAL</text>
    <line x1="530" y1="153" x2="1120" y2="153" stroke="#ffa500" stroke-width="4" />
    <text x="560" y="192" class="attr key">PK id</text>
    <text x="560" y="226" class="attr">UQ rental_number</text>
    <text x="560" y="260" class="attr">FK customer_id, bike_id</text>
    <text x="560" y="294" class="attr">FK start_station_id</text>
    <text x="560" y="328" class="attr">FK end_station_id NULL</text>
    <text x="560" y="362" class="attr">start_time, end_time NULL</text>
    <text x="560" y="396" class="attr">price_cents NULL</text>
  </g>

  <g aria-label="Kunde">
    <rect x="1240" y="105" width="350" height="310" rx="16" class="box" />
    <text x="1270" y="150" class="head">CUSTOMER</text>
    <line x1="1240" y1="168" x2="1590" y2="168" class="rel" />
    <text x="1270" y="205" class="attr key">PK id</text>
    <text x="1270" y="239" class="attr">UQ customer_number</text>
    <text x="1270" y="273" class="attr">first_name, last_name</text>
    <text x="1270" y="307" class="attr">UQ email</text>
    <text x="1270" y="341" class="attr">registered_on</text>
    <text x="1270" y="375" class="attr">active</text>
  </g>

  <g aria-label="Tarif">
    <rect x="1620" y="105" width="270" height="310" rx="16" class="box" />
    <text x="1645" y="150" class="head">TARIFF</text>
    <line x1="1620" y1="168" x2="1890" y2="168" class="rel" />
    <text x="1645" y="205" class="attr key">PK id</text>
    <text x="1645" y="239" class="attr">UQ tariff_code</text>
    <text x="1645" y="273" class="attr">UQ name</text>
    <text x="1645" y="307" class="attr">base_fee_cents</text>
    <text x="1645" y="341" class="attr">minute_price_cents</text>
    <text x="1645" y="375" class="attr">active</text>
  </g>

  <g aria-label="Radmodell">
    <rect x="40" y="685" width="510" height="305" rx="16" class="box" />
    <text x="70" y="730" class="head">BIKE_MODEL</text>
    <line x1="40" y1="748" x2="550" y2="748" class="rel" />
    <text x="70" y="785" class="attr key">PK id</text>
    <text x="70" y="819" class="attr">UQ model_code</text>
    <text x="70" y="853" class="attr">manufacturer, model_name</text>
    <text x="70" y="887" class="attr">category</text>
    <text x="70" y="921" class="attr">service_interval_days</text>
  </g>

  <g aria-label="Rad">
    <rect x="650" y="650" width="440" height="340" rx="16" class="box" />
    <text x="680" y="695" class="head">BIKE</text>
    <line x1="650" y1="713" x2="1090" y2="713" class="rel" />
    <text x="680" y="750" class="attr key">PK id</text>
    <text x="680" y="784" class="attr">UQ bike_number</text>
    <text x="680" y="818" class="attr">FK model_id</text>
    <text x="680" y="852" class="attr">FK current_station_id NULL</text>
    <text x="680" y="886" class="attr">status</text>
    <text x="680" y="920" class="attr">commissioned_on</text>
  </g>

  <g aria-label="Wartungseintrag">
    <rect x="1220" y="670" width="630" height="320" rx="16" class="box" />
    <text x="1250" y="715" class="head">MAINTENANCE_LOG</text>
    <line x1="1220" y1="733" x2="1850" y2="733" class="rel" />
    <text x="1250" y="770" class="attr key">PK, FK bike_id</text>
    <text x="1250" y="804" class="attr key">PK sequence_number</text>
    <text x="1250" y="838" class="attr">logged_on</text>
    <text x="1250" y="872" class="attr">issue</text>
    <text x="1250" y="906" class="attr">action_taken</text>
    <text x="1250" y="940" class="attr">cost_cents</text>
  </g>

  <path d="M440 210 H530" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="485" y="191" text-anchor="middle" class="label">Start</text>

  <path d="M440 330 H480 V420 H530" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many-orange)" />
  <text x="470" y="386" text-anchor="middle" class="label">Ende</text>

  <path d="M1120 230 H1240" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1180" y="211" text-anchor="middle" class="label">bucht</text>

  <path d="M1415 415 V525 H1755 V415" class="rel-optional" marker-start="url(#zero-many-orange)" marker-end="url(#zero-many-orange)" />
  <text x="1585" y="507" text-anchor="middle" class="label">Tarifzuordnung, valid_from</text>

  <path d="M825 465 V650" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="845" y="565" class="label">betrifft</text>

  <path d="M550 835 H650" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="600" y="816" text-anchor="middle" class="label">Modell</text>

  <path d="M1090 835 H1220" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="1155" y="816" text-anchor="middle" class="label">Wartung</text>

  <path d="M250 405 V560 H720 V650" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many-orange)" />
  <text x="465" y="542" text-anchor="middle" class="label">aktueller Standort</text>
</svg>
