<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm der Kfz-Werkstatt</title>
  <desc id="desc">Sechs fachliche Entitäten, zwei Beziehungen mit eigenen Attributen und optionale Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 23px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="60" y="58" class="head" font-size="44">Kfz-Werkstatt: Referenzmodell</text>
  <text x="1860" y="58" text-anchor="end" class="caption">orange gestrichelt = optionale Beziehung</text>

  <g aria-label="Kunde">
    <rect x="50" y="100" width="430" height="350" rx="16" class="box" />
    <text x="80" y="145" class="head">CUSTOMER</text>
    <line x1="50" y1="163" x2="480" y2="163" class="rel" />
    <text x="80" y="200" class="attr key">PK id</text>
    <text x="80" y="234" class="attr">UQ customer_number</text>
    <text x="80" y="268" class="attr">first_name, last_name</text>
    <text x="80" y="302" class="attr">UQ email</text>
    <text x="80" y="336" class="attr">phone</text>
    <text x="80" y="370" class="attr">registered_on</text>
    <text x="80" y="404" class="attr">active</text>
  </g>

  <g aria-label="Fahrzeug">
    <rect x="610" y="90" width="500" height="380" rx="16" class="box" />
    <text x="640" y="138" class="head">VEHICLE</text>
    <line x1="610" y1="158" x2="1110" y2="158" class="rel" />
    <text x="640" y="198" class="attr key">PK id</text>
    <text x="640" y="232" class="attr">FK owner_id</text>
    <text x="640" y="266" class="attr">FK previous_owner_id NULL</text>
    <text x="640" y="300" class="attr">UQ licence_plate</text>
    <text x="640" y="334" class="attr">UQ vin</text>
    <text x="640" y="368" class="attr">manufacturer, model</text>
    <text x="640" y="402" class="attr">construction_year</text>
    <text x="640" y="436" class="attr">mileage</text>
  </g>

  <g aria-label="Arbeitsauftrag">
    <rect x="1280" y="80" width="580" height="410" rx="16" class="box-main" />
    <text x="1310" y="128" class="head">WORK_ORDER</text>
    <line x1="1280" y1="148" x2="1860" y2="148" stroke="#ffa500" stroke-width="4" />
    <text x="1310" y="188" class="attr key">PK id</text>
    <text x="1310" y="222" class="attr">UQ order_number</text>
    <text x="1310" y="256" class="attr">FK vehicle_id</text>
    <text x="1310" y="290" class="attr">opened_on</text>
    <text x="1310" y="324" class="attr">closed_on NULL</text>
    <text x="1310" y="358" class="attr">status</text>
    <text x="1310" y="392" class="attr">mileage_in</text>
    <text x="1310" y="426" class="attr">complaint</text>
  </g>

  <g aria-label="Mechaniker">
    <rect x="70" y="740" width="470" height="280" rx="16" class="box" />
    <text x="100" y="785" class="head">MECHANIC</text>
    <line x1="70" y1="803" x2="540" y2="803" class="rel" />
    <text x="100" y="840" class="attr key">PK id</text>
    <text x="100" y="874" class="attr">UQ personnel_number</text>
    <text x="100" y="908" class="attr">first_name, last_name</text>
    <text x="100" y="942" class="attr">specialization</text>
    <text x="100" y="976" class="attr">hourly_rate, active</text>
  </g>

  <g aria-label="Ersatzteil">
    <rect x="680" y="700" width="530" height="320" rx="16" class="box" />
    <text x="710" y="745" class="head">PART</text>
    <line x1="680" y1="763" x2="1210" y2="763" class="rel" />
    <text x="710" y="800" class="attr key">PK id</text>
    <text x="710" y="834" class="attr">UQ part_number</text>
    <text x="710" y="868" class="attr">name, category</text>
    <text x="710" y="902" class="attr">shelf_code</text>
    <text x="710" y="936" class="attr">stock_quantity</text>
    <text x="710" y="970" class="attr">reorder_level, list_price</text>
  </g>

  <g aria-label="Rechnung">
    <rect x="1380" y="700" width="480" height="320" rx="16" class="box" />
    <text x="1410" y="745" class="head">INVOICE</text>
    <line x1="1380" y1="763" x2="1860" y2="763" class="rel" />
    <text x="1410" y="800" class="attr key">PK id</text>
    <text x="1410" y="834" class="attr">UQ invoice_number</text>
    <text x="1410" y="868" class="attr">UQ FK work_order_id</text>
    <text x="1410" y="902" class="attr">issued_on, due_on</text>
    <text x="1410" y="936" class="attr">paid_on NULL</text>
    <text x="1410" y="970" class="attr">net_amount, tax_amount</text>
    <text x="1410" y="1004" class="attr">status</text>
  </g>

  <path d="M480 220 H610" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="545" y="200" text-anchor="middle" class="label">ist Halter</text>

  <path d="M480 385 H545 V335 H610" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many)" />
  <text x="545" y="365" text-anchor="middle" class="label">Vorhalter</text>

  <path d="M1110 250 H1280" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="1195" y="230" text-anchor="middle" class="label">hat Aufträge</text>

  <path d="M540 860 H585 V570 H1430 V490" class="rel" marker-start="url(#zero-many)" marker-end="url(#zero-many)" />
  <text x="880" y="548" text-anchor="middle" class="label">arbeitet an, hours_worked</text>

  <path d="M945 700 V625 H1560 V490" class="rel" marker-start="url(#zero-many)" marker-end="url(#zero-many)" />
  <text x="1255" y="605" text-anchor="middle" class="label">Position: line_number, quantity, unit_price</text>

  <path d="M1700 490 V700" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#one)" />
  <text x="1725" y="615" class="label">hat optional</text>

  <text x="60" y="1060" class="caption">WORK_ORDER_PART: PK (work_order_id, line_number) · WORK_ORDER_MECHANIC: PK (work_order_id, mechanic_id)</text>
</svg>
