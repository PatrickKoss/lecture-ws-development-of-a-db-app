<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm der Bibliothek</title>
  <desc id="desc">Sechs Entitäten mit Schlüsseln, Attributen und Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 23px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="70" y="58" class="head" font-size="44">Bibliothek: Referenzmodell</text>
  <text x="1840" y="58" text-anchor="end" class="caption">orange gestrichelt = optionale Vormerkung</text>

  <g aria-label="Mitglied">
    <rect x="60" y="100" width="390" height="285" rx="16" class="box" />
    <text x="90" y="145" class="head">MEMBER</text>
    <line x1="60" y1="163" x2="450" y2="163" class="rel" />
    <text x="90" y="200" class="attr key">PK id</text>
    <text x="90" y="234" class="attr">UQ membership_number</text>
    <text x="90" y="268" class="attr">first_name, last_name</text>
    <text x="90" y="302" class="attr">UQ email</text>
    <text x="90" y="336" class="attr">joined_on, active</text>
  </g>

  <g aria-label="Ausleihe">
    <rect x="650" y="90" width="500" height="350" rx="16" class="box-main" />
    <text x="680" y="138" class="head">LOAN</text>
    <line x1="650" y1="158" x2="1150" y2="158" stroke="#ffa500" stroke-width="4" />
    <text x="680" y="198" class="attr key">PK id</text>
    <text x="680" y="232" class="attr">FK member_id</text>
    <text x="680" y="266" class="attr">FK book_id, copy_number</text>
    <text x="680" y="300" class="attr">FK reservation_id NULL UQ</text>
    <text x="680" y="334" class="attr">loaned_on</text>
    <text x="680" y="368" class="attr">due_on</text>
    <text x="680" y="402" class="attr">returned_on NULL</text>
  </g>

  <g aria-label="Exemplar">
    <rect x="1350" y="100" width="500" height="315" rx="16" class="box" />
    <text x="1380" y="145" class="head">COPY</text>
    <line x1="1350" y1="163" x2="1850" y2="163" class="rel" />
    <text x="1380" y="200" class="attr key">PK, FK book_id</text>
    <text x="1380" y="234" class="attr key">PK copy_number</text>
    <text x="1380" y="268" class="attr">UQ barcode</text>
    <text x="1380" y="302" class="attr">branch_code</text>
    <text x="1380" y="336" class="attr">acquired_on</text>
    <text x="1380" y="370" class="attr">condition</text>
  </g>

  <g aria-label="Vormerkung">
    <rect x="60" y="700" width="440" height="300" rx="16" class="box" />
    <text x="90" y="745" class="head">RESERVATION</text>
    <line x1="60" y1="763" x2="500" y2="763" class="rel" />
    <text x="90" y="800" class="attr key">PK id</text>
    <text x="90" y="834" class="attr">FK member_id</text>
    <text x="90" y="868" class="attr">FK book_id</text>
    <text x="90" y="902" class="attr">reserved_on, expires_on</text>
    <text x="90" y="936" class="attr">status</text>
  </g>

  <g aria-label="Autor">
    <rect x="690" y="735" width="380" height="240" rx="16" class="box" />
    <text x="720" y="780" class="head">AUTHOR</text>
    <line x1="690" y1="798" x2="1070" y2="798" class="rel" />
    <text x="720" y="835" class="attr key">PK id</text>
    <text x="720" y="869" class="attr">first_name</text>
    <text x="720" y="903" class="attr">last_name</text>
    <text x="720" y="937" class="attr">birth_year</text>
  </g>

  <g aria-label="Buch">
    <rect x="1320" y="680" width="530" height="320" rx="16" class="box" />
    <text x="1350" y="725" class="head">BOOK</text>
    <line x1="1320" y1="743" x2="1850" y2="743" class="rel" />
    <text x="1350" y="780" class="attr key">PK id</text>
    <text x="1350" y="814" class="attr">UQ isbn</text>
    <text x="1350" y="848" class="attr">title</text>
    <text x="1350" y="882" class="attr">publication_year</text>
    <text x="1350" y="916" class="attr">subject_area</text>
    <text x="1350" y="950" class="attr">shelf_code</text>
  </g>

  <path d="M450 235 H650" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="550" y="214" text-anchor="middle" class="label">leiht aus</text>

  <path d="M1150 235 H1350" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1250" y="214" text-anchor="middle" class="label">betrifft</text>

  <path d="M1600 415 V680" class="rel" marker-start="url(#one-many)" marker-end="url(#one)" />
  <text x="1625" y="555" class="label">gehört zu</text>

  <path d="M280 385 V700" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="305" y="555" class="label">merkt vor</text>

  <path d="M500 850 H585 V420 H650" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-one)" />
  <text x="515" y="650" class="label">führt optional zu</text>

  <path d="M1070 860 H1320" class="rel" marker-start="url(#zero-many)" marker-end="url(#one-many)" />
  <text x="1195" y="838" text-anchor="middle" class="label">verfasst, author_order</text>

  <path d="M280 1000 V1030 H1585 V1000" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="930" y="1020" text-anchor="middle" class="label">gilt für Buchtitel</text>
</svg>
