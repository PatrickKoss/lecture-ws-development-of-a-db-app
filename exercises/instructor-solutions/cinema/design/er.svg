<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm des Kinos</title>
  <desc id="desc">Sechs Entitäten mit Schlüsseln, Attributen und Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 23px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="70" y="58" class="head" font-size="44">Kino: Referenzmodell</text>
  <text x="1840" y="58" text-anchor="end" class="caption">orange gestrichelt = optionales Kundenkonto</text>

  <g aria-label="Kunde">
    <rect x="60" y="100" width="440" height="285" rx="16" class="box" />
    <text x="90" y="145" class="head">CUSTOMER</text>
    <line x1="60" y1="163" x2="500" y2="163" class="rel" />
    <text x="90" y="200" class="attr key">PK id</text>
    <text x="90" y="234" class="attr">UQ customer_number</text>
    <text x="90" y="268" class="attr">first_name, last_name</text>
    <text x="90" y="302" class="attr">UQ email</text>
    <text x="90" y="336" class="attr">registered_on, active</text>
  </g>

  <g aria-label="Ticket">
    <rect x="650" y="80" width="560" height="400" rx="16" class="box-main" />
    <text x="680" y="128" class="head">TICKET</text>
    <line x1="650" y1="148" x2="1210" y2="148" stroke="#ffa500" stroke-width="4" />
    <text x="680" y="188" class="attr key">PK id</text>
    <text x="680" y="222" class="attr">UQ ticket_number</text>
    <text x="680" y="256" class="attr">FK screening_id, hall_id</text>
    <text x="680" y="290" class="attr">FK row_label, seat_number</text>
    <text x="680" y="324" class="attr">FK customer_id NULL</text>
    <text x="680" y="358" class="attr key">price_cents</text>
    <text x="680" y="392" class="attr key">sold_at</text>
    <text x="680" y="426" class="attr">UQ screening + seat</text>
  </g>

  <g aria-label="Sitz">
    <rect x="1400" y="100" width="450" height="315" rx="16" class="box" />
    <text x="1430" y="145" class="head">SEAT</text>
    <line x1="1400" y1="163" x2="1850" y2="163" class="rel" />
    <text x="1430" y="200" class="attr key">PK, FK hall_id</text>
    <text x="1430" y="234" class="attr key">PK row_label</text>
    <text x="1430" y="268" class="attr key">PK seat_number</text>
    <text x="1430" y="302" class="attr">category</text>
    <text x="1430" y="336" class="attr">accessible</text>
  </g>

  <g aria-label="Film">
    <rect x="60" y="720" width="480" height="280" rx="16" class="box" />
    <text x="90" y="765" class="head">MOVIE</text>
    <line x1="60" y1="783" x2="540" y2="783" class="rel" />
    <text x="90" y="820" class="attr key">PK id</text>
    <text x="90" y="854" class="attr">UQ movie_code</text>
    <text x="90" y="888" class="attr">title, release_year</text>
    <text x="90" y="922" class="attr">duration_minutes</text>
    <text x="90" y="956" class="attr">fsk_code, minimum_age</text>
  </g>

  <g aria-label="Vorstellung">
    <rect x="680" y="680" width="540" height="320" rx="16" class="box" />
    <text x="710" y="725" class="head">SCREENING</text>
    <line x1="680" y1="743" x2="1220" y2="743" class="rel" />
    <text x="710" y="780" class="attr key">PK id</text>
    <text x="710" y="814" class="attr">UQ screening_code</text>
    <text x="710" y="848" class="attr">FK movie_id</text>
    <text x="710" y="882" class="attr">FK hall_id</text>
    <text x="710" y="916" class="attr">starts_at</text>
    <text x="710" y="950" class="attr">language, projection_format</text>
  </g>

  <g aria-label="Saal">
    <rect x="1400" y="700" width="450" height="290" rx="16" class="box" />
    <text x="1430" y="745" class="head">HALL</text>
    <line x1="1400" y1="763" x2="1850" y2="763" class="rel" />
    <text x="1430" y="800" class="attr key">PK id</text>
    <text x="1430" y="834" class="attr">UQ hall_number</text>
    <text x="1430" y="868" class="attr">UQ name</text>
    <text x="1430" y="902" class="attr">capacity</text>
  </g>

  <path d="M500 240 H650" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many)" />
  <text x="575" y="216" text-anchor="middle" class="label">kauft</text>

  <path d="M1210 240 H1400" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1305" y="216" text-anchor="middle" class="label">verkauft Sitz</text>

  <path d="M930 480 V680" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="955" y="585" class="label">gehört zu</text>

  <path d="M540 850 H680" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="610" y="826" text-anchor="middle" class="label">wird gezeigt</text>

  <path d="M1220 850 H1400" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1310" y="826" text-anchor="middle" class="label">findet statt in</text>

  <path d="M1625 415 V700" class="rel" marker-start="url(#one-many)" marker-end="url(#one)" />
  <text x="1650" y="565" class="label">gehört zu</text>
</svg>
