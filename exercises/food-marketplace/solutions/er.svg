<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm der Essens-Lieferplattform</title>
  <desc id="desc">Sechs Entitäten sowie die attributierte Beziehung OrderItem mit Schlüsseln und Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 23px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
      .rel-note { fill: #ffa500; font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; paint-order: stroke; stroke: #0d1117; stroke-width: 8; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="60" y="56" class="head" font-size="44">RuhrLiefert: Referenzmodell</text>
  <text x="1860" y="56" text-anchor="end" class="caption">orange gestrichelt = optionale Beziehung</text>

  <g aria-label="Restaurant">
    <rect x="40" y="100" width="460" height="290" rx="16" class="box" />
    <text x="70" y="145" class="head">RESTAURANT</text>
    <line x1="40" y1="163" x2="500" y2="163" class="rel" />
    <text x="70" y="200" class="attr key">PK id</text>
    <text x="70" y="234" class="attr">UQ partner_number</text>
    <text x="70" y="268" class="attr">name, street</text>
    <text x="70" y="302" class="attr">postal_code, city</text>
    <text x="70" y="336" class="attr">commission_rate, active</text>
  </g>

  <g aria-label="Bewertung">
    <rect x="720" y="80" width="480" height="250" rx="16" class="box" />
    <text x="750" y="125" class="head">REVIEW</text>
    <line x1="720" y1="143" x2="1200" y2="143" class="rel" />
    <text x="750" y="180" class="attr key">PK id</text>
    <text x="750" y="214" class="attr">UQ, FK order_id</text>
    <text x="750" y="248" class="attr">rating, comment NULL</text>
    <text x="750" y="282" class="attr">reviewed_on</text>
  </g>

  <g aria-label="Kunde">
    <rect x="1420" y="100" width="460" height="290" rx="16" class="box" />
    <text x="1450" y="145" class="head">CUSTOMER</text>
    <line x1="1420" y1="163" x2="1880" y2="163" class="rel" />
    <text x="1450" y="200" class="attr key">PK id</text>
    <text x="1450" y="234" class="attr">UQ customer_number</text>
    <text x="1450" y="268" class="attr">first_name, last_name</text>
    <text x="1450" y="302" class="attr">UQ email</text>
    <text x="1450" y="336" class="attr">registered_on, active</text>
  </g>

  <g aria-label="Bestellung">
    <rect x="675" y="400" width="570" height="430" rx="16" class="box-main" />
    <text x="705" y="448" class="head">ORDER</text>
    <line x1="675" y1="468" x2="1245" y2="468" stroke="#ffa500" stroke-width="4" />
    <text x="705" y="508" class="attr key">PK id</text>
    <text x="705" y="542" class="attr">UQ order_number</text>
    <text x="705" y="576" class="attr">FK customer_id</text>
    <text x="705" y="610" class="attr">FK restaurant_id</text>
    <text x="705" y="644" class="attr">FK courier_id NULL</text>
    <text x="705" y="678" class="attr">ordered_at, order_type</text>
    <text x="705" y="712" class="attr">status</text>
    <text x="705" y="746" class="attr">picked_up_at NULL</text>
    <text x="705" y="780" class="attr">delivered_at NULL</text>
  </g>

  <g aria-label="Gericht">
    <rect x="40" y="730" width="460" height="280" rx="16" class="box" />
    <text x="70" y="775" class="head">DISH</text>
    <line x1="40" y1="793" x2="500" y2="793" class="rel" />
    <text x="70" y="830" class="attr key">PK id</text>
    <text x="70" y="864" class="attr">FK restaurant_id</text>
    <text x="70" y="898" class="attr">name, category</text>
    <text x="70" y="932" class="attr">vat_rate, current_price</text>
    <text x="70" y="966" class="attr">active</text>
  </g>

  <g aria-label="Kurier">
    <rect x="1420" y="730" width="460" height="280" rx="16" class="box" />
    <text x="1450" y="775" class="head">COURIER</text>
    <line x1="1420" y1="793" x2="1880" y2="793" class="rel" />
    <text x="1450" y="830" class="attr key">PK id</text>
    <text x="1450" y="864" class="attr">UQ courier_number</text>
    <text x="1450" y="898" class="attr">first_name, last_name</text>
    <text x="1450" y="932" class="attr">UQ phone</text>
    <text x="1450" y="966" class="attr">vehicle_type, active</text>
  </g>

  <path d="M500 245 H590 V530 H675" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="575" y="220" text-anchor="middle" class="label">erhält Bestellungen</text>

  <path d="M1420 245 H1330 V530 H1245" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="1345" y="220" text-anchor="middle" class="label">gibt auf</text>

  <path d="M270 390 V730" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="295" y="570" class="label">bietet an</text>

  <path d="M675 650 H585 V870 H500" class="rel" marker-start="url(#one-many)" marker-end="url(#zero-many)" />
  <text x="560" y="690" text-anchor="middle" class="label">enthält</text>
  <text x="960" y="880" text-anchor="middle" class="rel-note">ORDER_ITEM, schwach</text>
  <text x="960" y="915" text-anchor="middle" class="label">position_number, quantity, unit_price</text>

  <path d="M1245 650 H1335 V870 H1420" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many)" />
  <text x="1360" y="650" class="label">wird ausgeliefert von</text>
  <text x="1360" y="682" class="label">picked_up_at</text>
  <text x="1360" y="714" class="label">delivered_at</text>

  <path d="M960 330 V400" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#one)" />
  <text x="985" y="372" class="label">hat optional</text>
</svg>
