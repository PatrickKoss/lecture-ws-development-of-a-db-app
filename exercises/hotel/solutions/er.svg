<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm des Hotels Rheinblick</title>
  <desc id="desc">Sechs Kernentitäten und zwei Beziehungen mit eigenen Attributen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 23px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 21px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="70" y="58" class="head" font-size="44">Hotel Rheinblick: Referenzmodell</text>
  <text x="1840" y="58" text-anchor="end" class="caption">orange gestrichelt = optionaler Check-in-Mitarbeiter</text>

  <g aria-label="Gast">
    <rect x="60" y="100" width="440" height="315" rx="16" class="box" />
    <text x="90" y="145" class="head">GUEST</text>
    <line x1="60" y1="163" x2="500" y2="163" class="rel" />
    <text x="90" y="200" class="attr key">PK id</text>
    <text x="90" y="234" class="attr">UQ guest_number</text>
    <text x="90" y="268" class="attr">first_name, last_name</text>
    <text x="90" y="302" class="attr">UQ email, phone</text>
    <text x="90" y="336" class="attr">company_name NULL</text>
    <text x="90" y="370" class="attr">company_account_number NULL</text>
  </g>

  <g aria-label="Buchung">
    <rect x="690" y="80" width="540" height="390" rx="16" class="box-main" />
    <text x="720" y="128" class="head">BOOKING</text>
    <line x1="690" y1="148" x2="1230" y2="148" stroke="#ffa500" stroke-width="4" />
    <text x="720" y="188" class="attr key">PK id</text>
    <text x="720" y="222" class="attr">UQ booking_number</text>
    <text x="720" y="256" class="attr">FK guest_id</text>
    <text x="720" y="290" class="attr">FK checked_in_by_employee_id NULL</text>
    <text x="720" y="324" class="attr">booked_on</text>
    <text x="720" y="358" class="attr">arrival_on, departure_on</text>
    <text x="720" y="392" class="attr">status</text>
  </g>

  <g aria-label="Zimmer">
    <rect x="1390" y="100" width="460" height="330" rx="16" class="box" />
    <text x="1420" y="145" class="head">ROOM</text>
    <line x1="1390" y1="163" x2="1850" y2="163" class="rel" />
    <text x="1420" y="200" class="attr key">PK floor</text>
    <text x="1420" y="234" class="attr key">PK room_number</text>
    <text x="1420" y="268" class="attr">FK room_type_id</text>
    <text x="1420" y="302" class="attr">cleaning_area</text>
    <text x="1420" y="336" class="attr">status</text>
    <text x="1420" y="370" class="attr">accessible</text>
  </g>

  <g aria-label="Mitarbeiter">
    <rect x="60" y="700" width="460" height="265" rx="16" class="box" />
    <text x="90" y="745" class="head">EMPLOYEE</text>
    <line x1="60" y1="763" x2="520" y2="763" class="rel" />
    <text x="90" y="800" class="attr key">PK id</text>
    <text x="90" y="834" class="attr">UQ employee_code</text>
    <text x="90" y="868" class="attr">first_name, last_name</text>
    <text x="90" y="902" class="attr">role, hired_on, active</text>
  </g>

  <g aria-label="Leistung">
    <rect x="710" y="715" width="450" height="250" rx="16" class="box" />
    <text x="740" y="760" class="head">SERVICE</text>
    <line x1="710" y1="778" x2="1160" y2="778" class="rel" />
    <text x="740" y="815" class="attr key">PK id</text>
    <text x="740" y="849" class="attr">UQ service_code</text>
    <text x="740" y="883" class="attr">name</text>
    <text x="740" y="917" class="attr">list_price_cents, active</text>
  </g>

  <g aria-label="Zimmertyp">
    <rect x="1380" y="690" width="470" height="275" rx="16" class="box" />
    <text x="1410" y="735" class="head">ROOM_TYPE</text>
    <line x1="1380" y1="753" x2="1850" y2="753" class="rel" />
    <text x="1410" y="790" class="attr key">PK id</text>
    <text x="1410" y="824" class="attr">UQ type_code</text>
    <text x="1410" y="858" class="attr">UQ name</text>
    <text x="1410" y="892" class="attr">capacity</text>
    <text x="1410" y="926" class="attr">standard_price_cents</text>
  </g>

  <path d="M500 245 H690" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="595" y="220" text-anchor="middle" class="label">bucht</text>

  <path d="M1230 410 H1390" class="rel" marker-start="url(#one-many)" marker-end="url(#one-many)" />
  <text x="1310" y="500" text-anchor="middle" class="label">BOOKING_ROOM</text>
  <text x="1310" y="528" text-anchor="middle" class="label">Check-in, Check-out, Preis</text>

  <path d="M520 830 H610 V390 H690" class="rel-optional" marker-start="url(#zero-one)" marker-end="url(#zero-many)" />
  <text x="625" y="620" class="label">checkt optional ein</text>

  <path d="M950 470 V715" class="rel" marker-start="url(#zero-many)" marker-end="url(#zero-many)" />
  <text x="975" y="575" class="label">BOOKING_SERVICE</text>
  <text x="975" y="605" class="label">Menge, Datum, Preis</text>

  <path d="M1615 430 V690" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1640" y="565" class="label">hat Typ</text>

  <text x="70" y="1035" class="caption">ROOM ist ein schwacher Kandidat: Die Zimmernummer ist nur zusammen mit der Etage eindeutig.</text>
</svg>
