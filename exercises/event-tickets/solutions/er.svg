<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm für Veranstaltungstickets</title>
  <desc id="desc">Sechs fachliche Entitäten und die Zuordnung Ticket mit Schlüsseln, Attributen und Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 29px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 21px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 25px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="60" y="55" class="head" font-size="42">Veranstaltungstickets: Referenzmodell</text>
  <text x="1860" y="55" text-anchor="end" class="caption">orange gestrichelt = externer Veranstalter optional</text>

  <g aria-label="Spielort">
    <rect x="45" y="105" width="390" height="280" rx="16" class="box" />
    <text x="75" y="148" class="head">VENUE</text>
    <line x1="45" y1="165" x2="435" y2="165" class="rel" />
    <text x="75" y="201" class="attr key">PK id</text>
    <text x="75" y="232" class="attr">UQ venue_code</text>
    <text x="75" y="263" class="attr">UQ name</text>
    <text x="75" y="294" class="attr">street, postal_code</text>
    <text x="75" y="325" class="attr">city</text>
    <text x="75" y="356" class="attr">capacity</text>
  </g>

  <g aria-label="Veranstaltung">
    <rect x="670" y="78" width="570" height="390" rx="16" class="box-main" />
    <text x="700" y="123" class="head">EVENT</text>
    <line x1="670" y1="143" x2="1240" y2="143" stroke="#ffa500" stroke-width="4" />
    <text x="700" y="180" class="attr key">PK id</text>
    <text x="700" y="211" class="attr">UQ event_number</text>
    <text x="700" y="242" class="attr">title, event_type</text>
    <text x="700" y="273" class="attr">admission_code</text>
    <text x="700" y="304" class="attr">FK venue_id</text>
    <text x="700" y="335" class="attr">FK organizer_id NULL</text>
    <text x="700" y="366" class="attr">event_on</text>
    <text x="700" y="397" class="attr">doors_open, starts_at</text>
    <text x="700" y="428" class="attr">UQ venue + date + start</text>
  </g>

  <g aria-label="Veranstalter">
    <rect x="1480" y="105" width="390" height="280" rx="16" class="box" />
    <text x="1510" y="148" class="head">ORGANIZER</text>
    <line x1="1480" y1="165" x2="1870" y2="165" class="rel" />
    <text x="1510" y="201" class="attr key">PK id</text>
    <text x="1510" y="232" class="attr">UQ organizer_number</text>
    <text x="1510" y="263" class="attr">UQ name</text>
    <text x="1510" y="294" class="attr">contact_person</text>
    <text x="1510" y="325" class="attr">UQ email</text>
    <text x="1510" y="356" class="attr">phone</text>
  </g>

  <g aria-label="Käufer">
    <rect x="45" y="735" width="370" height="260" rx="16" class="box" />
    <text x="75" y="778" class="head">BUYER</text>
    <line x1="45" y1="795" x2="415" y2="795" class="rel" />
    <text x="75" y="831" class="attr key">PK id</text>
    <text x="75" y="862" class="attr">UQ buyer_number</text>
    <text x="75" y="893" class="attr">first_name, last_name</text>
    <text x="75" y="924" class="attr">UQ email</text>
    <text x="75" y="955" class="attr">registered_on</text>
  </g>

  <g aria-label="Bestellung">
    <rect x="520" y="700" width="390" height="295" rx="16" class="box" />
    <text x="550" y="743" class="head">ORDER</text>
    <line x1="520" y1="760" x2="910" y2="760" class="rel" />
    <text x="550" y="796" class="attr key">PK id</text>
    <text x="550" y="827" class="attr">UQ order_number</text>
    <text x="550" y="858" class="attr">FK buyer_id</text>
    <text x="550" y="889" class="attr">ordered_at</text>
    <text x="550" y="920" class="attr">status</text>
  </g>

  <g aria-label="Ticket als Zuordnung">
    <rect x="1010" y="610" width="500" height="385" rx="16" class="box-main" />
    <text x="1040" y="653" class="head">TICKET</text>
    <line x1="1010" y1="670" x2="1510" y2="670" stroke="#ffa500" stroke-width="4" />
    <text x="1040" y="706" class="attr key">PK id</text>
    <text x="1040" y="737" class="attr">FK order_id</text>
    <text x="1040" y="768" class="attr">FK event_id, category_name</text>
    <text x="1040" y="799" class="attr">ticket_number</text>
    <text x="1040" y="830" class="attr">seat_label NULL</text>
    <text x="1040" y="861" class="attr">price_paid</text>
    <text x="1040" y="892" class="attr key">checked_in_at NULL</text>
    <text x="1040" y="923" class="attr">UQ order + ticket_number</text>
  </g>

  <g aria-label="Ticketkategorie">
    <rect x="1580" y="680" width="300" height="315" rx="16" class="box" />
    <text x="1605" y="723" class="head" font-size="25">TICKET_CATEGORY</text>
    <line x1="1580" y1="740" x2="1880" y2="740" class="rel" />
    <text x="1605" y="776" class="attr key">PK, FK event_id</text>
    <text x="1605" y="807" class="attr key">PK name</text>
    <text x="1605" y="838" class="attr">list_price</text>
    <text x="1605" y="869" class="attr">quota</text>
    <text x="1605" y="900" class="attr">seating_type</text>
    <text x="1605" y="942" class="label">schwache Entität</text>
  </g>

  <path d="M435 250 H670" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="552" y="226" text-anchor="middle" class="label">Datum + Einlass</text>

  <path d="M1240 250 H1480" class="rel-optional" marker-start="url(#zero-many)" marker-end="url(#zero-one)" />
  <text x="1360" y="226" text-anchor="middle" class="label">betreut optional</text>

  <path d="M415 850 H520" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="468" y="827" text-anchor="middle" class="label">bestellt</text>

  <path d="M910 835 H1010" class="rel" marker-start="url(#one)" marker-end="url(#one-many)" />
  <text x="960" y="812" text-anchor="middle" class="label">enthält</text>

  <path d="M1510 835 H1580" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1545" y="812" text-anchor="middle" class="label">gehört zu</text>

  <path d="M1080 468 V540 H1260 V610" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="1165" y="528" text-anchor="middle" class="label">hat Tickets</text>

  <path d="M975 468 V535 H1730 V680" class="rel" marker-start="url(#one)" marker-end="url(#one-many)" />
  <text x="1655" y="560" text-anchor="end" class="label">hat Kategorien</text>
</svg>
