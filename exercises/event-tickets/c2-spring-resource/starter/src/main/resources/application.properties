spring.application.name=event-tickets-rest
spring.datasource.url=jdbc:sqlite:event-tickets.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
server.port=${SERVER_PORT:8081}
server.error.include-message=never
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# OpenAPI wird aus Controller und DTOs generiert.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.override-with-generic-response=false
