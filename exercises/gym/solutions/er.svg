<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm des Fitnessstudios KraftWerk</title>
  <desc id="desc">Sechs eigenständige Entitäten und zwei Beziehungsentitäten mit Schlüsseln, Attributen und Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 21px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 20px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 24px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="60" y="58" class="head" font-size="43">Fitnessstudio KraftWerk: Referenzmodell</text>
  <text x="1870" y="58" text-anchor="end" class="caption">orange = Beziehungsentität, gestrichelt = optional</text>

  <g aria-label="Mitglied">
    <rect x="50" y="100" width="350" height="300" rx="16" class="box" />
    <text x="78" y="145" class="head">MEMBER</text>
    <line x1="50" y1="163" x2="400" y2="163" class="rel" />
    <text x="78" y="202" class="attr key">PK id</text>
    <text x="78" y="236" class="attr">UQ membership_number</text>
    <text x="78" y="270" class="attr">first_name</text>
    <text x="78" y="304" class="attr">last_name</text>
    <text x="78" y="338" class="attr">UQ email</text>
    <text x="78" y="372" class="attr">joined_on, active</text>
  </g>

  <g aria-label="Mitgliedschaft">
    <rect x="490" y="100" width="430" height="300" rx="16" class="box-main" />
    <text x="518" y="145" class="head">MEMBERSHIP</text>
    <line x1="490" y1="163" x2="920" y2="163" stroke="#ffa500" stroke-width="4" />
    <text x="518" y="202" class="attr key">PK, FK member_id</text>
    <text x="518" y="236" class="attr key">PK starts_on</text>
    <text x="518" y="270" class="attr">FK plan_id</text>
    <text x="518" y="304" class="attr">ends_on NULL</text>
  </g>

  <g aria-label="Tarif">
    <rect x="1010" y="100" width="370" height="300" rx="16" class="box" />
    <text x="1038" y="145" class="head">PLAN</text>
    <line x1="1010" y1="163" x2="1380" y2="163" class="rel" />
    <text x="1038" y="202" class="attr key">PK id</text>
    <text x="1038" y="236" class="attr">UQ plan_code</text>
    <text x="1038" y="270" class="attr">UQ name</text>
    <text x="1038" y="304" class="attr">monthly_fee_cents</text>
    <text x="1038" y="338" class="attr">minimum_term_months</text>
    <text x="1038" y="372" class="attr">active</text>
  </g>

  <g aria-label="Raum">
    <rect x="1470" y="100" width="400" height="300" rx="16" class="box" />
    <text x="1498" y="145" class="head">ROOM</text>
    <line x1="1470" y1="163" x2="1870" y2="163" class="rel" />
    <text x="1498" y="202" class="attr key">PK id</text>
    <text x="1498" y="236" class="attr">UQ room_code</text>
    <text x="1498" y="270" class="attr">UQ name</text>
    <text x="1498" y="304" class="attr">capacity</text>
    <text x="1498" y="338" class="attr">floor</text>
  </g>

  <g aria-label="Buchung">
    <rect x="50" y="640" width="430" height="330" rx="16" class="box-main" />
    <text x="78" y="685" class="head">BOOKING</text>
    <line x1="50" y1="703" x2="480" y2="703" stroke="#ffa500" stroke-width="4" />
    <text x="78" y="742" class="attr key">PK id</text>
    <text x="78" y="776" class="attr">FK member_id</text>
    <text x="78" y="810" class="attr">FK course_session_id</text>
    <text x="78" y="844" class="attr">booked_on</text>
    <text x="78" y="878" class="attr">attended</text>
    <text x="78" y="912" class="attr">UQ member_id + session</text>
    <text x="78" y="948" class="caption">fachlich schwach</text>
  </g>

  <g aria-label="Kurstermin">
    <rect x="570" y="620" width="500" height="380" rx="16" class="box" />
    <text x="598" y="665" class="head">COURSE_SESSION</text>
    <line x1="570" y1="683" x2="1070" y2="683" class="rel" />
    <text x="598" y="722" class="attr key">PK id</text>
    <text x="598" y="756" class="attr">FK course_id</text>
    <text x="598" y="790" class="attr">FK trainer_id</text>
    <text x="598" y="824" class="attr">session_date</text>
    <text x="598" y="858" class="attr">start_time</text>
    <text x="598" y="892" class="attr">maximum_participants</text>
    <text x="598" y="926" class="attr">cancelled</text>
  </g>

  <g aria-label="Kurs">
    <rect x="1160" y="640" width="390" height="330" rx="16" class="box" />
    <text x="1188" y="685" class="head">COURSE</text>
    <line x1="1160" y1="703" x2="1550" y2="703" class="rel" />
    <text x="1188" y="742" class="attr key">PK id</text>
    <text x="1188" y="776" class="attr">UQ course_code</text>
    <text x="1188" y="810" class="attr">title</text>
    <text x="1188" y="844" class="attr">level</text>
    <text x="1188" y="878" class="attr">duration_minutes</text>
    <text x="1188" y="912" class="attr">FK room_id NULL</text>
  </g>

  <g aria-label="Trainer">
    <rect x="1600" y="640" width="270" height="330" rx="16" class="box" />
    <text x="1625" y="685" class="head">TRAINER</text>
    <line x1="1600" y1="703" x2="1870" y2="703" class="rel" />
    <text x="1625" y="742" class="attr key">PK id</text>
    <text x="1625" y="776" class="attr">UQ trainer_number</text>
    <text x="1625" y="810" class="attr">first_name</text>
    <text x="1625" y="844" class="attr">last_name</text>
    <text x="1625" y="878" class="attr">UQ email</text>
    <text x="1625" y="912" class="attr">specialty</text>
    <text x="1625" y="946" class="attr">hired_on, active</text>
  </g>

  <path d="M400 250 H490" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="445" y="224" text-anchor="middle" class="label">hat</text>

  <path d="M920 250 H1010" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="965" y="224" text-anchor="middle" class="label">nutzt</text>

  <path d="M225 400 V640" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="246" y="528" class="label">bucht</text>

  <path d="M480 800 H570" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="525" y="776" text-anchor="middle" class="label">gilt für</text>

  <path d="M1070 800 H1160" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1115" y="776" text-anchor="middle" class="label">Termin</text>

  <path d="M1355 640 V500 H1670 V400" class="rel-optional" marker-start="url(#zero-many)" marker-end="url(#zero-one)" />
  <text x="1515" y="478" text-anchor="middle" class="label">findet optional statt in</text>

  <path d="M820 1000 V1040 H1735 V970" class="rel" marker-start="url(#zero-many)" marker-end="url(#one)" />
  <text x="1280" y="1030" text-anchor="middle" class="label">wird geleitet von</text>
</svg>
