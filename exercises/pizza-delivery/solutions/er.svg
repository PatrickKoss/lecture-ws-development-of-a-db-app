<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ER-Diagramm des Pizza-Lieferdiensts</title>
  <desc id="desc">Sechs eigenständige Entitäten, die schwache Bestellposition und ihre Beziehungen in Crow's-Foot-Notation.</desc>
  <defs>
    <style>
      .box { fill: #0d1117; stroke: #00bfff; stroke-width: 4; }
      .box-main { fill: #161b22; stroke: #ffa500; stroke-width: 5; }
      .head { fill: #ffffff; font: 700 32px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .attr { fill: #ffffff; font: 23px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .key { fill: #ffa500; font-weight: 700; }
      .rel { fill: none; stroke: #00bfff; stroke-width: 4; }
      .rel-optional { fill: none; stroke: #ffa500; stroke-width: 4; stroke-dasharray: 12 9; }
      .label { fill: #ffffff; font: 22px Inter, Arial, sans-serif; paint-order: stroke; stroke: #0d1117; stroke-width: 8; stroke-linejoin: round; }
      .caption { fill: #ffffff; font: 26px Inter, Arial, sans-serif; }
    </style>
    <marker id="one" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 1 V17" stroke="#00bfff" stroke-width="4" />
    </marker>
    <marker id="zero-one" markerWidth="30" markerHeight="20" refX="25" refY="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="10" r="5" fill="#0d1117" stroke="#ffa500" stroke-width="3" />
      <path d="M22 2 V18" stroke="#ffa500" stroke-width="4" />
    </marker>
    <marker id="zero-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <circle cx="6" cy="15" r="5" fill="#0d1117" stroke="#00bfff" stroke-width="3" />
      <path d="M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
    <marker id="one-many" markerWidth="38" markerHeight="30" refX="34" refY="15" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M9 3 V27 M14 15 L34 3 M14 15 H34 M14 15 L34 27" stroke="#00bfff" stroke-width="4" fill="none" />
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#0d1117" />
  <text x="70" y="58" class="head" font-size="44">Pizza-Lieferdienst: Referenzmodell</text>
  <text x="1840" y="58" text-anchor="end" class="caption">orange gestrichelt = optionale Zuordnung</text>

  <g aria-label="Kunde">
    <rect x="40" y="100" width="400" height="300" rx="16" class="box" />
    <text x="70" y="145" class="head">CUSTOMER</text>
    <line x1="40" y1="163" x2="440" y2="163" class="rel" />
    <text x="70" y="200" class="attr key">PK id</text>
    <text x="70" y="232" class="attr">UQ customer_number</text>
    <text x="70" y="264" class="attr">first_name, last_name</text>
    <text x="70" y="296" class="attr">UQ email, UQ phone</text>
    <text x="70" y="328" class="attr">created_on, active</text>
  </g>

  <g aria-label="Bestellung">
    <rect x="700" y="80" width="520" height="370" rx="16" class="box-main" />
    <text x="730" y="128" class="head">ORDER</text>
    <line x1="700" y1="148" x2="1220" y2="148" stroke="#ffa500" stroke-width="4" />
    <text x="730" y="187" class="attr key">PK id</text>
    <text x="730" y="219" class="attr">UQ order_number</text>
    <text x="730" y="251" class="attr">FK customer_id</text>
    <text x="730" y="283" class="attr">FK delivery_address_id NULL</text>
    <text x="730" y="315" class="attr">FK driver_id NULL</text>
    <text x="730" y="347" class="attr">ordered_on, order_type</text>
    <text x="730" y="379" class="attr">status, delivery_fee</text>
  </g>

  <g aria-label="Fahrer">
    <rect x="1500" y="100" width="370" height="285" rx="16" class="box" />
    <text x="1530" y="145" class="head">DRIVER</text>
    <line x1="1500" y1="163" x2="1870" y2="163" class="rel" />
    <text x="1530" y="200" class="attr key">PK id</text>
    <text x="1530" y="232" class="attr">UQ driver_number</text>
    <text x="1530" y="264" class="attr">first_name, last_name</text>
    <text x="1530" y="296" class="attr">UQ phone</text>
    <text x="1530" y="328" class="attr">hired_on, active</text>
  </g>

  <g aria-label="Adresse">
    <rect x="40" y="710" width="430" height="260" rx="16" class="box" />
    <text x="70" y="755" class="head">ADDRESS</text>
    <line x1="40" y1="773" x2="470" y2="773" class="rel" />
    <text x="70" y="810" class="attr key">PK id</text>
    <text x="70" y="842" class="attr">FK customer_id</text>
    <text x="70" y="874" class="attr">label</text>
    <text x="70" y="906" class="attr">street, house_number</text>
    <text x="70" y="938" class="attr">postal_code, city</text>
  </g>

  <g aria-label="Belag">
    <rect x="520" y="720" width="380" height="250" rx="16" class="box" />
    <text x="550" y="765" class="head">TOPPING</text>
    <line x1="520" y1="783" x2="900" y2="783" class="rel" />
    <text x="550" y="820" class="attr key">PK id</text>
    <text x="550" y="852" class="attr">UQ name</text>
    <text x="550" y="884" class="attr">vegetarian</text>
    <text x="550" y="916" class="attr">allergen NULL</text>
  </g>

  <g aria-label="Pizza">
    <rect x="970" y="680" width="420" height="320" rx="16" class="box" />
    <text x="1000" y="725" class="head">PIZZA</text>
    <line x1="970" y1="743" x2="1390" y2="743" class="rel" />
    <text x="1000" y="780" class="attr key">PK id</text>
    <text x="1000" y="812" class="attr">UQ pizza_number</text>
    <text x="1000" y="844" class="attr">name</text>
    <text x="1000" y="876" class="attr">category</text>
    <text x="1000" y="908" class="attr">oven_station</text>
    <text x="1000" y="940" class="attr">base_price, active</text>
  </g>

  <g aria-label="Bestellposition">
    <rect x="1450" y="680" width="420" height="320" rx="16" class="box-main" />
    <text x="1480" y="725" class="head">ORDER_ITEM</text>
    <line x1="1450" y1="743" x2="1870" y2="743" stroke="#ffa500" stroke-width="4" />
    <text x="1480" y="780" class="attr key">PK, FK order_id</text>
    <text x="1480" y="812" class="attr key">PK position_number</text>
    <text x="1480" y="844" class="attr">FK pizza_id</text>
    <text x="1480" y="876" class="attr">quantity</text>
    <text x="1480" y="908" class="attr">unit_price</text>
  </g>

  <path d="M440 230 H700" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="570" y="208" text-anchor="middle" class="label">bestellt</text>

  <path d="M230 400 V710" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
  <text x="255" y="555" class="label">hat</text>

  <path d="M820 450 V600 H300 V710" class="rel-optional" marker-start="url(#zero-many)" marker-end="url(#zero-one)" />
  <text x="540" y="580" text-anchor="middle" class="label">liefert an</text>

  <path d="M1220 230 H1500" class="rel-optional" marker-start="url(#zero-many)" marker-end="url(#zero-one)" />
  <text x="1360" y="208" text-anchor="middle" class="label">fährt optional</text>

  <path d="M1080 450 V540 H1660 V680" class="rel" marker-start="url(#one)" marker-end="url(#one-many)" />
  <text x="1370" y="518" text-anchor="middle" class="label">enthält Positionen</text>

  <path d="M710 720 V640 H1180 V680" class="rel" marker-start="url(#zero-many)" marker-end="url(#zero-many)" />
  <text x="945" y="622" text-anchor="middle" class="label">PizzaTopping, extra_charge</text>

  <path d="M1390 962 H1450" class="rel" marker-start="url(#one)" marker-end="url(#zero-many)" />
</svg>
