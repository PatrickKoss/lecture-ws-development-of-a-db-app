<?xml version="1.0" encoding="UTF-8"?>
<!-- Constellation / distributed-system background texture.
     Reused across every slide via CSS background-image. Kept very faint so
     it never competes with slide content. Matches the look in style-slides/. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1920 1080"
  preserveAspectRatio="xMidYMid slice"
  aria-hidden="true"
>
  <rect width="1920" height="1080" fill="#0d1117" />

  <!-- Faint connecting lines -->
  <g stroke="#1f2a3a" stroke-width="1" fill="none" opacity="0.7">
    <line x1="220" y1="220" x2="420" y2="160" />
    <line x1="420" y1="160" x2="640" y2="240" />
    <line x1="640" y1="240" x2="880" y2="180" />
    <line x1="1080" y1="160" x2="1320" y2="240" />
    <line x1="1320" y1="240" x2="1540" y2="180" />
    <line x1="1540" y1="180" x2="1740" y2="260" />
    <line x1="180" y1="860" x2="380" y2="920" />
    <line x1="380" y1="920" x2="620" y2="860" />
    <line x1="620" y1="860" x2="860" y2="940" />
    <line x1="1060" y1="900" x2="1280" y2="860" />
    <line x1="1280" y1="860" x2="1500" y2="920" />
    <line x1="1500" y1="920" x2="1720" y2="860" />
    <line x1="160" y1="540" x2="360" y2="500" />
    <line x1="1560" y1="540" x2="1760" y2="500" />
  </g>

  <!-- Dim blue dots scattered around the edges (avoid center for content). -->
  <g fill="#00bfff" opacity="0.35">
    <circle cx="220" cy="220" r="3" />
    <circle cx="420" cy="160" r="2" />
    <circle cx="640" cy="240" r="2.5" />
    <circle cx="880" cy="180" r="2" />
    <circle cx="1080" cy="160" r="2.5" />
    <circle cx="1320" cy="240" r="3" />
    <circle cx="1540" cy="180" r="2" />
    <circle cx="1740" cy="260" r="2.5" />

    <circle cx="180" cy="860" r="2.5" />
    <circle cx="380" cy="920" r="2" />
    <circle cx="620" cy="860" r="3" />
    <circle cx="860" cy="940" r="2" />
    <circle cx="1060" cy="900" r="2.5" />
    <circle cx="1280" cy="860" r="2" />
    <circle cx="1500" cy="920" r="3" />
    <circle cx="1720" cy="860" r="2" />

    <circle cx="160" cy="540" r="2" />
    <circle cx="360" cy="500" r="2.5" />
    <circle cx="1560" cy="540" r="2" />
    <circle cx="1760" cy="500" r="2.5" />
  </g>

  <!-- A few amber accent dots to match references -->
  <g fill="#ffa500" opacity="0.45">
    <circle cx="540" cy="380" r="2" />
    <circle cx="1380" cy="700" r="2" />
    <circle cx="80" cy="120" r="2" />
    <circle cx="1860" cy="980" r="2" />
  </g>
</svg>
